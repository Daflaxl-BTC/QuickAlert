name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
      env:
        # Mock Environment Variables für Build (werden nicht verwendet, aber verhindern Fehler)
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'mock_key_for_build' }}
        NEXT_PUBLIC_BASE_URL: https://quickalert.eu
        ADMIN_EMAIL: felix-bredl@gmx.de
    
    - name: Check build
      run: |
        if [ ! -d ".next" ]; then
          echo "Build failed - .next directory not found"
          exit 1
        fi
